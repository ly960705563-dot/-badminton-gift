<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【本草脉案】领取你的专属理疗方</title>
    
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
        :root { --bg-color: #F7EEDD; --ink-black: #1A1A1A; --jade-green: #4F7942; --clay-red: #A52A2A; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; font-family: 'Noto Serif SC', serif; background-color: var(--bg-color); color: var(--ink-black); overflow-x: hidden; height: 100vh; }
        .paper-texture { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://www.transparenttextures.com/patterns/parchment.png'); pointer-events: none; opacity: 0.5; z-index: 999; }
        #app { max-width: 500px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 1; }
        .screen { display: none; flex: 1; padding: 30px 20px; flex-direction: column; justify-content: center; align-items: center; text-align: center; animation: fadeIn 0.4s ease; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        h1 { font-size: 1.8rem; margin-bottom: 10px; color: var(--clay-red); font-weight: 700; letter-spacing: 2px; }
        .subtitle { font-size: 1rem; color: #555; margin-bottom: 30px; line-height: 1.6; }
        .btn { background-color: var(--jade-green); color: white; padding: 15px 40px; border-radius: 30px; border: none; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(79, 121, 66, 0.3); cursor: pointer; transition: all 0.3s; font-family: inherit; }
        .option { background: white; margin-bottom: 12px; padding: 16px; border-radius: 10px; border: 1px solid #ddd; width: 100%; text-align: left; font-size: 1rem; transition: all 0.2s; }
        .option:active { background: #f0f0f0; border-color: var(--jade-green); }
        #draw-container { width: 100%; height: 200px; position: relative; overflow: hidden; margin: 20px 0; display: flex; align-items: center; }
        .reel { display: flex; position: absolute; left: 50%; transition: transform 3.5s cubic-bezier(0.15, 0, 0.15, 1); }
        .card { width: 100px; height: 140px; background: white; margin: 0 8px; flex-shrink: 0; border: 2px solid #333; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-weight: bold; writing-mode: vertical-rl; letter-spacing: 4px; font-size: 0.9rem; }
        #report-card { background-color: #fff; padding: 20px; width: 100%; border: 1px solid #eee; position: relative; text-align: center; }
        .img-container { width: 100%; aspect-ratio: 3 / 4; background-color: #fcfcfc; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 1px solid #eee; }
        .report-img { width: 100%; height: 100%; object-fit: contain; }
        .footer-note { margin-top: 15px; font-size: 1.1rem; color: var(--ink-black); border-top: 1px dashed #ccc; padding-top: 12px; font-weight: bold; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        #final-img { width: 100%; max-height: 80vh; object-fit: contain; border-radius: 4px; border: 2px solid #fff; }
    </style>
</head>
<body>
<div style="display:none;"><img src="logo.png"></div>
<div class="paper-texture"></div>
<div id="app">
    <div id="screen-home" class="screen active">
        <h1>本草理疗评估</h1>
        <p class="subtitle">辨证施策 · 循经寻方<br>让身体回归平衡状态</p>
        <button class="btn" onclick="nextScreen('q1')">开始测一测</button>
    </div>
    <div id="screen-q1" class="screen">
        <h3>您当前处于什么状态？</h3>
        <div class="option" onclick="handleFlow('active')">刚刚结束运动（打球/健身等）</div>
        <div class="option" onclick="handleFlow('rest')">享受静谧时光（居家/休息/办公）</div>
    </div>
    <div id="screen-qa1" class="screen">
        <h3>运动后的核心体感？</h3>
        <div class="option" onclick="record('feel', 'pain')">肌肉关节酸胀，有僵硬感</div>
        <div class="option" onclick="record('feel', 'heavy')">出汗多，感觉身体沉重乏力</div>
        <div class="option" onclick="record('feel', 'hot')">燥热难耐，口渴想喝冰饮</div>
    </div>
    <div id="screen-safety" class="screen">
        <h3>安全提醒：检查脚部皮肤</h3>
        <div class="option" onclick="startDrawing()">皮肤完好，无创口</div>
        <div class="option" onclick="nextScreen('warning')">有红肿、破损或水泡</div>
    </div>
    <div id="screen-draw" class="screen">
        <h3>正在封存脉案...</h3>
        <div id="draw-container"><div id="reel" class="reel"></div></div>
    </div>
    <div id="screen-result" class="screen">
        <div id="report-card">
            <h2 style="color:var(--clay-red); margin-top:0;">理疗脉案</h2>
            <div class="img-container">
                <img id="res-img" src="" class="report-img" onerror="this.src='aicaoqingshu.png'">
            </div>
            <div class="footer-note">凭此脉案向“六一”领取对应补给包</div>
        </div>
        <button class="btn" style="margin-top:20px;" onclick="generatePoster()">保存脉案海报</button>
    </div>
</div>
<div id="overlay" class="overlay" onclick="this.style.display='none'">
    <img id="final-img" src="">
    <p style="color:white; margin-top:15px;">↑ 长按图片保存，发送给六一领奖</p>
</div>
<script>
    const config = {
        'huoxue': { img: 'huoxue.png', name: '活血通络' },
        'qushi': { img: 'qushi.png', name: '祛湿健脾' },
        'jieyu': { img: 'jieyu.png', name: '解郁舒心' },
        'quhan': { img: 'quhan.png', name: '暖身驱寒' },
        'nuangong': { img: 'nuangong.png', name: '暖宫调经' },
        'zhiyang': { img: 'zhiyang.png', name: '杀虫止痒' },
        'jieshu': { img: 'jieshu.png', name: '清凉解暑' },
        'aicao': { img: 'aicaoqingshu.png', name: '艾草清暑' }
    };
    let userAnswers = {};
    let currentFlow = '';
    function nextScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById('screen-' + id).classList.add('active'); }
    function handleFlow(type) { currentFlow = type; userAnswers['scene'] = type; if(type === 'active') nextScreen('qa1'); else nextScreen('qr1'); }
    function record(key, val) { userAnswers[key] = val; nextScreen('safety'); }
    function calculateResult() {
        const { scene, feel } = userAnswers;
        if (scene === 'active' && feel === 'pain') return 'huoxue';
        if (feel === 'heavy') return 'qushi';
        return 'aicaoqingshu';
    }
    function startDrawing() {
        const finalKey = calculateResult();
        nextScreen('draw');
        const reel = document.getElementById('reel');
        const keys = Object.keys(config);
        let html = '';
        for(let i=0; i<30; i++) { html += `<div class="card">${config[keys[i % keys.length]].name}</div>`; }
        html += `<div class="card" style="border-color:var(--clay-red); color:var(--clay-red)">${config[finalKey].name}</div>`;
        reel.innerHTML = html;
        setTimeout(() => reel.style.transform = `translateX(-${30 * 116}px)`, 100);
        setTimeout(() => { document.getElementById('res-img').src = config[finalKey].img; nextScreen('result'); }, 3800);
    }
    function generatePoster() {
        const card = document.getElementById('report-card');
        html2canvas(card, { scale: 3, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
            document.getElementById('final-img').src = canvas.toDataURL("image/png");
            document.getElementById('overlay').style.display = 'flex';
        });
    }
</script>
</body>
</html>
